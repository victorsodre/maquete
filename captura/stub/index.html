<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stub da captura: quadrado neon</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cena"></canvas>
<script>
// Página mínima com a mesma API da cena (window.__maquete), só para testar a captura sem depender
// do Three.js nem dos dados. Um quadrado neon anda com t sobre fundo preto; a linha violeta é o
// "nível d'água". Tudo é função pura de t e do nível: mesmo t, mesmo quadro. Sem Date.now, sem
// Math.random, sem relógio próprio.
(() => {
  const DURACAO_S = 61;
  const canvas = document.getElementById('cena');
  const ctx = canvas.getContext('2d', { alpha: false });
  const estado = { t: 0, nivel_agua_m: 0, calls: 0 };

  function ajustar() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function desenhar(t) {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    const lado = Math.round(Math.min(W, H) * 0.18);
    const f = ((t % DURACAO_S) + DURACAO_S) % DURACAO_S / DURACAO_S;   // 0..1 ao longo do Short
    const x = Math.round((W - lado) * f);
    const y = Math.round(H * 0.5 - lado / 2 + Math.sin(f * Math.PI * 2) * H * 0.2);
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(x, y, lado, lado);
    ctx.shadowBlur = 0;
    // linha d'água: desce com o nível (0 m no meio, -5500 m perto do pé do quadro)
    const ya = Math.round(H * (0.5 + 0.35 * Math.min(1, Math.max(0, -estado.nivel_agua_m / 5500))));
    ctx.strokeStyle = '#ff2bd6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, ya);
    ctx.lineTo(W, ya);
    ctx.stroke();
    estado.t = t;
    estado.calls++;
  }

  // Resolve depois que o compositor apresentou o quadro (um requestAnimationFrame).
  function apresentado() {
    return new Promise((r) => requestAnimationFrame(() => r()));
  }

  const params = new URLSearchParams(location.search);
  const t0 = Number(params.get('t') || 0);
  ajustar();
  window.addEventListener('resize', () => { ajustar(); desenhar(estado.t); });

  window.__maquete = {
    ready: (async () => { desenhar(Number.isFinite(t0) ? t0 : 0); await apresentado(); return true; })(),
    setTime: async (t) => { desenhar(Number(t)); await apresentado(); },
    setWater: async (m) => { estado.nivel_agua_m = Number(m); desenhar(estado.t); await apresentado(); },
    duration: () => DURACAO_S,
    getState: () => ({ t: estado.t, nivel_agua_m: estado.nivel_agua_m, pos: [estado.t, 0, 0], alvo: [0, 0, 0] }),
    metrics: () => ({ calls: estado.calls, triangles: 2 }),
  };
})();
</script>
</body>
</html>
